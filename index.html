<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoMan AI - ہر سوال کا جواب</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:system-ui}
.container{max-width:800px;margin:auto;padding:20px;padding-bottom:100px}
.top{text-align:center;margin:30px 0}
.top h1{font-size:35px;margin:0}
.top p{color:#888}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.tags span{background:#1e1e1e;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px}
.chat{display:flex;flex-direction:column;gap:15px;margin-top:20px}
.msg{padding:15px 18px;border-radius:20px;max-width:85%;line-height:1.7;white-space:pre-wrap}
.user{align-self:flex-end;background:#2563eb;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:#1c1c1c;border:1px solid #2a2a2a;border-bottom-left-radius:5px}
.inputBox{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;padding:15px}
.inner{max-width:800px;margin:auto;display:flex;gap:10px}
input{flex:1;background:#1e1e1e;border:1px solid #333;color:white;padding:15px 18px;border-radius:30px;outline:none;font-size:16px}
button{background:white;color:black;border:none;padding:0 25px;border-radius:30px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<div class="top">
<h1>NoMan AI 🤖</h1>
<p>ڈاکٹر، انجینئر، استاد، ہر چیز - کوئی بھی سوال پوچھیں</p>
<div class="tags">
<span>🩺 ڈاکٹر</span><span>💻 انجینئر</span><span>📚 استاد</span><span>⚖️ وکیل</span><span>🕌 اسلامی</span><span>💡 جنرل نالج</span>
</div>
</div>
<div class="chat" id="chat">
<div class="msg ai">السلام علیکم! میں NoMan AI ہوں۔

میں ہر چیز میں آپ کی مدد کر سکتا ہوں:
🩺 صحت، بیماری
💻 کوڈنگ، کمپیوٹر
📚 پڑھائی، نوکری
🕌 دین، دعا
اور دنیا کی ہر چیز...

بس اپنا سوال لکھیں!</div>
</div>
</div>

<div class="inputBox">
<div class="inner">
<input type="text" id="q" placeholder="کوئی بھی سوال لکھیں...">
<button onclick="ask()">بھیجیں</button>
</div>
</div>

<script>
const API_KEY = "YAHAN_APNI_GEMINI_API_KEY_DALEIN";

async function ask(){
 let input = document.getElementById("q");
 let text = input.value.trim();
 if(!text) return;
 let chat = document.getElementById("chat");
 chat.innerHTML += `<div class="msg user">${text}</div>`;
 input.value = "";
 let id = "t"+Date.now();
 chat.innerHTML += `<div class="msg ai" id="${id}">سوچ رہا ہوں...</div>`;
 window.scrollTo(0, document.body.scrollHeight);

 let expertPrompt = `You are NoMan AI, an all-in-one expert. You are a doctor, engineer, teacher, Islamic scholar, lawyer and everything. The user asked: "${text}". Give a helpful, accurate, short and easy answer. Answer in the same language user used (Urdu or English).`;

 try{
  let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({contents:[{parts:[{text:expertPrompt}]}]})
  });
  let data = await res.json();
  let ans = data.candidates?.[0]?.content?.parts?.[0]?.text || "معذرت، دوبارہ کوشش کریں";
  document.getElementById(id).innerText = ans;
 } catch(e){
  document.getElementById(id).innerText = "API Key کا مسئلہ ہے، اپنی Gemini Key چیک کریں";
 }
 window.scrollTo(0, document.body.scrollHeight);
}
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key=="Enter") ask() });
</script>
</body>
</html>
