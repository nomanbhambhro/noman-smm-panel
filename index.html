<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noman SMM Panel</title>
<style>
body{font-family:system-ui;background:#0f0f0f;color:white;padding:15px;margin:0}
h1{text-align:center;color:#ff0050;margin-bottom:5px}
.sub{text-align:center;color:#aaa;margin-bottom:20px}
.card{background:#1c1c1c;border-radius:15px;padding:18px;margin:15px 0;border:1px solid #333}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.tiktok{background:#ff0050;color:white}
input,select{width:100%;padding:12px;border-radius:8px;border:none;margin:8px 0;background:#2a2a2a;color:white;box-sizing:border-box}
.infoBox{background:#222;padding:12px;border-radius:8px;text-align:center;border:1px dashed #ff0050;margin-bottom:10px}
</style>
</head>
<body>
<h1>Noman SMM Panel</h1>
<p class="sub">سب سے سستا اور تیز پینل</p>

<div class="card">
<h3>🎵 TikTok Order</h3>
<input id="tiktokLink" placeholder="اپنی ویڈیو / پروفائل کا لنک ڈالیں">
<select id="tiktokService"><option>Likes</option><option>Followers</option><option>Views</option></select>
<select id="tiktokAmount">
<option value="100">100 - 200 Rs</option>
<option value="500">500 - 500 Rs</option>
<option value="1000">1000 - 800 Rs</option>
<option value="5000">5000 - 3000 Rs</option>
</select>
<button class="btn tiktok" onclick="orderTikTok()">آرڈر کریں - TikTok پر رابطہ کریں</button>
</div>

<div class="card" style="border-color:#ff0050;text-align:center">
<p><b>TikTok ID: @rhan.khan839</b></p>
<p style="color:#aaa;font-size:13px">آرڈر پر کلک کرتے ہی آپ میری TikTok پروفائل پر چلے جائیں گے، وہاں مجھے میسج کر دیں</p>
<button class="btn tiktok" onclick="window.open('https://www.tiktok.com/@rhan.khan839','_blank')">TikTok کھولیں @rhan.khan839</button>
</div>

<script>
function orderTikTok(){
let link=document.getElementById('tiktokLink').value;
let ser=document.getElementById('tiktokService').value;
let am=document.getElementById('tiktokAmount').value;
if(!link){alert('پہلے لنک ڈالیں');return;}
let msg = `السلام علیکم بھائی! مجھے آرڈر چاہیے%0A%0A Service: ${ser}%0A Amount: ${am}%0A Link: ${link}`;
window.open(`https://www.tiktok.com/@rhan.khan839`, '_blank');
alert('اب TikTok پر جا کر مجھے یہ میسج کر دیں: \n' + `Service: ${ser}, Amount: ${am}, Link: ${link}`);
}
</script>
</body>
</html>
